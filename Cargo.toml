[package]
name = "cuaca"
version = "0.1.2"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
toml = "1.1.0"
dirs = "6.0"
colored = "3.0.0"

[profile.release]
debug = false
strip = true
lto = "thin"
codegen-units = 1
