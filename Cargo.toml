[package]
name = "cuaca"
version = "0.2.1"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
toml = "1.1.0"
dirs = "7.0.0"

[profile.release]
debug = false
strip = true
lto = "thin"
codegen-units = 1
