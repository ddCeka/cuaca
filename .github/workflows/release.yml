name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: cuaca-linux-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: cuaca-macos-aarch64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: cuaca-macos-x86_64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: cuaca-windows-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" cuaca
      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tar -czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" cuaca.exe
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
