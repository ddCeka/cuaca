name: CI & Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Format & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Update Cargo.lock
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: cargo generate-lockfile

      - name: Commit updated Cargo.lock
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "ddCeka"
          git config user.email "57752215+ddCeka@users.noreply.github.com"
          if ! git diff --quiet Cargo.lock; then
            git add Cargo.lock
            git commit -m "chore: update Cargo.lock"
            git push
          fi

      - name: Run tests
        run: cargo test --locked

  release:
    name: Build Release (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: cuaca-linux-x86_64.tar.gz
            bin_name: cuaca
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: cuaca-macos-aarch64.tar.gz
            bin_name: cuaca
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset_name: cuaca-macos-x86_64.tar.gz
            bin_name: cuaca
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: cuaca-windows-x86_64.tar.gz
            bin_name: cuaca.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: tar -czf "${{ matrix.asset_name }}" -C "target/${{ matrix.target }}/release" "${{ matrix.bin_name }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true
