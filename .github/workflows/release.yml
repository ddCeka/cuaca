name: Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Update Cargo.lock
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          cargo generate-lockfile
          if ! git diff --quiet Cargo.lock; then
            git config user.name "ddCeka"
            git config user.email "57752215+ddCeka[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: update Cargo.lock"
            git push
          fi

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: cuaca-linux-x86_64
            bin_name: cuaca
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: cuaca-macos-aarch64
            bin_name: cuaca
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: cuaca-macos-x86_64
            bin_name: cuaca
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: cuaca-windows-x86_64
            bin_name: cuaca.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "staging/${{ matrix.bin_name }}"
          tar -czf "${{ matrix.asset_name }}.tar.gz" -C staging "${{ matrix.bin_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
